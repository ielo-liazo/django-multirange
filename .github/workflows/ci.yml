name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra tests

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

      - name: pyright (static value typing)
        run: uv run --no-sync pyright tests/typing_check.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        django-version: [ '4.2', '5.2', '6.0', '6.1' ]
        exclude:
          # Django 6.0 requires Python 3.12+
          - python-version: '3.10'
            django-version: '6.0'
          - python-version: '3.11'
            django-version: '6.0'
          # Django 6.1 requires Python 3.12+
          - python-version: '3.10'
            django-version: '6.1'
          - python-version: '3.11'
            django-version: '6.1'
          # Django 4.2 supports Python 3.8-3.12 only
          - python-version: '3.13'
            django-version: '4.2'
          - python-version: '3.14'
            django-version: '4.2'
          # Django 5.2 supports Python 3.10-3.14 (3.14 since 5.2.7)

    services:
      postgres:
        # Postgres 14 introduced multirange types; use 18 (current stable).
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Tell tests/conftest.py to use the service container directly.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project with test extras
        run: uv sync --extra tests

      - name: Pin Django to ${{ matrix.django-version }}
        # Override the resolved Django with the matrix version. We have to
        # do this after `uv sync` because the lockfile pins different Django
        # majors per Python version.
        run: uv pip install "django==${{ matrix.django-version }}.*"

      - name: Run tests
        # `--no-sync` is critical: without it `uv run` re-syncs the venv
        # back to the lockfile, undoing the Django pin above.
        run: >-
          uv run --no-sync pytest -v
          --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        # One artifact per matrix cell would collide, so name it after the cell.
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}-dj${{ matrix.django-version }}
          path: coverage.xml
          if-no-files-found: error
