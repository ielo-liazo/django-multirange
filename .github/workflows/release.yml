name: Release

on:
  push:
    tags: [ 'v*' ]
  # Allows building the artifacts without publishing, to check the
  # distribution before cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check the distribution metadata
        run: uvx twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Configure this environment with a required reviewer to gate uploads.
    environment:
      name: pypi
      url: https://pypi.org/p/django-multirange
    permissions:
      # Required for PyPI Trusted Publishing (OIDC); no API token needed.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
