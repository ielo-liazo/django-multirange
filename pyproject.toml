[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "multirange"
module-root = ""

[project]
name = "django-multirange"
version = "1.0.0"
description = "Django multirange plugin"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "Rémi Desgrange", email = "remi.desgrange@ielo.net" } ]
license = { text = "MIT" }

dependencies = [
    "Django>=4.2",
    "psycopg>=3"
]

[project.optional-dependencies]
tests = [
  "pytest>=7.0",
  "pytest-django>=4.5",
  "hypothesis>=6.100",
  "testcontainers[postgres]>=4.7",
]

[project.urls]
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
Homepage = "https://github.com/ielo-liazo/django-multirange"
Changelog = "https://github.com/ielo-liazo/django-multirange/releases"
Source = "https://github.com/ielo-liazo/django-multirange"
Releasenotes = "https://github.com/ielo-liazo/django-multirange/releases/latest"
Documentation = "https://github.com/ielo-liazo/django-multirange"
Issues = "https://github.com/ielo-liazo/django-multirange/issues"


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"


[tool.coverage.run]
source = ["multirange"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
