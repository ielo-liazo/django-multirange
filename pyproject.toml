[build-system]
requires = ["uv_build>=0.9.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "multirange"
module-root = ""
# README and LICENSE are picked up from [project]; the changelog is not.
source-include = ["CHANGELOG.md"]

[project]
name = "django-multirange"
version = "0.1.0"
description = "Django ORM support for PostgreSQL multirange types"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "Rémi Desgrange", email = "remi.desgrange@ielo.net" } ]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["django", "postgresql", "multirange", "psycopg", "range"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "Django>=4.2",
    "psycopg>=3"
]

[project.optional-dependencies]
tests = [
  "pytest>=7.0",
  "pytest-django>=4.5",
  "hypothesis>=6.100",
  "testcontainers[postgres]>=4.7",
  "pytest-cov>=5.0",
]

[project.urls]
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
Homepage = "https://github.com/ielo-liazo/django-multirange"
Changelog = "https://github.com/ielo-liazo/django-multirange/blob/main/CHANGELOG.md"
Source = "https://github.com/ielo-liazo/django-multirange"
Releasenotes = "https://github.com/ielo-liazo/django-multirange/releases/latest"
Documentation = "https://github.com/ielo-liazo/django-multirange"
Issues = "https://github.com/ielo-liazo/django-multirange/issues"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"


[tool.coverage.run]
source = ["multirange"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
