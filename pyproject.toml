[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-multirange"
version = "0.0.0"
description = "Django multirange plugin"
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "", email = "" } ]
license = { text = "MIT" }

dependencies = []

[project.optional-dependencies]
tests = [
  "pytest>=7.0",
  "pytest-django>=4.5"
]

[tool.setuptools]
packages = {find = {where = ["."]}}

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
