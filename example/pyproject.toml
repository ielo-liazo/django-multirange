[project]
name = "django-multirange-example"
version = "0.1.0"
description = "Sample Django project demonstrating django-multirange"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-multirange",
    "psycopg[binary]>=3",
]

[tool.uv]
# This is an application, not a library: nothing to build or install.
package = false

[tool.uv.sources]
# Use the checkout this example lives in, not a release from PyPI.
django-multirange = { path = "..", editable = true }
