# Postgres for the example project. Multirange types need PostgreSQL 14+;
# this pins the current stable release.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: multirange_example
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d multirange_example"]
      interval: 2s
      timeout: 3s
      retries: 15
